name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Changesets opens (or updates) a "Version Packages" PR when unreleased changesets
  # exist on master. Merging that PR bumps versions and CHANGELOGs; the publish job
  # below runs only when there is nothing left to version.
  version:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Decide before changesets/action runs: it consumes the changeset files while
      # versioning, so checking afterwards would wrongly report "nothing pending".
      - name: Detect pending changesets
        id: pending
        run: |
          set -euo pipefail
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "has_changesets=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: changesets/action@v1
        if: steps.pending.outputs.has_changesets == 'true'
        with:
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      has_changesets: ${{ steps.pending.outputs.has_changesets }}

  publish:
    needs: version
    if: needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # install runs each plugin's `prepare` only when it actually links modules,
      # so a warm workspace would otherwise publish with `lib/` missing.
      - run: pnpm build
      - name: Verify build output
        run: |
          set -euo pipefail
          for pkg in plugins/*/; do
            pkg=${pkg%/}
            shipped=$(node -p "require('./$pkg/package.json').files.join('\n')")
            while IFS= read -r file; do
              # `files` may list directories (e.g. web-icons' `assets`), so -e, not -f.
              test -e "$pkg/$file" || { echo "::error::$pkg/$file is missing"; exit 1; }
            done <<< "$shipped"
          done
      # Publish only versions missing from the registry. pnpm (not changeset publish)
      # is used so `catalog:` is rewritten and --provenance is applied.
      # No --tag: every version must stay reachable as `dsh plugin add @banzhe/dsh-<name>`,
      # which resolves the `latest` tag.
      # Auth: npm trusted publishing (OIDC, via id-token: write) when the npm package has
      # this workflow configured as a trusted publisher. NPM_TOKEN is a fallback only;
      # remove it once OIDC publishing is verified.
      - name: Publish unpublished versions
        run: pnpm -r --filter "./plugins/*" publish --access public --provenance --no-git-checks --report-summary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Show publish summary
        if: always()
        run: test -f pnpm-publish-summary.json && cat pnpm-publish-summary.json || echo "publish did not finish, so no summary was written"
