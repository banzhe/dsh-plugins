  '@deepseek-ai/dsh-launch-environment': 0.2.1-alpha.1
  '@deepseek-ai/dsh-llm': 0.2.1-alpha.1
  '@deepseek-ai/dsh-session': 0.2.1-alpha.1
  '@deepseek-ai/dsh-session-title': 0.2.1-alpha.1
  '@deepseek-ai/dsh-storage-domain': 0.2.1-alpha.1
  '@deepseek-ai/dsh-workspace': 0.2.1-alpha.1
  '@deepseek-ai/schemastery': 3.18.5-alpha.1
  '@types/node': ^22.20.0
  '@types/react': ~18.3.31
  '@types/react-dom': ~18.3.7
  '@vitest/coverage-v8': ^4.1.8
  immer: ^10.1.1
  jsdom: ^27.0.0
  lightningcss: ^1.33.0
  react: ^18.3.1
  react-dom: ^18.3.1
  tsdown: ^0.22.2
  typescript: ^6.0.3
  vitest: ^4.1.8
  zod: 4.4.3
  zustand: ~4.4.7

minimumReleaseAgeExclude:
