packages:
  - plugins/*
  # Private build helpers the Bundles share (tsdown config, stylesheet loaders):
  # TS source direct, never published. See docs/adr/0009-css-as-files.md.
  - devkit

# strict：pnpm add 只接受 catalog 内的版本，拒绝手写版本号，防止版本再次发散。
catalogMode: strict

# 统一管理依赖版本：devDependencies 用 "catalog:" 引用，升级只改这里。
# 所有 @deepseek-ai/dsh-* 固定为同一个 DSH 版本，不使用 caret，避免各插件解析到不同版本。
#
# peerDependencies 不能写 "catalog:"：DSH 在 Profile 组装阶段
# (packages/boot/app-boot/src/plugin-compatibility.ts) 用 semver.satisfies 校验
# peerDependencies 里的 @deepseek-ai/dsh-* 范围，"catalog:" 不是合法范围，会让整个
# Bundle 被静默 skip。所以 peerDependencies 写显式版本（见各 plugins/*/package.json）。
#
# 注意：peerDependencies 写固定版本意味着 DSH 每发一个版本都要同步重发所有插件，
# 否则它们在新版本上会被整个 skip。升级 DSH 时必须同时改三处：本文件的 catalog、
# 各 package.json 的 peerDependencies、以及各 package.json 的自身 version。
catalog:
  '@deepseek-ai/cordis': 4.0.4
  '@deepseek-ai/dsh-agent': 0.2.0-rc.2
  '@deepseek-ai/dsh-agent-preset-registry': 0.2.0-rc.2
  '@deepseek-ai/dsh-api-remotes': 0.2.0-rc.2
  '@deepseek-ai/dsh-api-session-controller': 0.2.0-rc.2
  '@deepseek-ai/dsh-api-workspace-controller': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-locale': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-store': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-conversation': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-plugin-manager': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-renderer': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-session': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-settings': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-slots': 0.2.0-rc.2
  '@deepseek-ai/dsh-client-ui-workspace': 0.2.0-rc.2
  '@deepseek-ai/dsh-commands': 0.2.0-rc.2
  '@deepseek-ai/dsh-host-open-in-app': 0.2.0-rc.2
  '@deepseek-ai/dsh-launch-environment': 0.2.0-rc.2
  '@deepseek-ai/dsh-llm': 0.2.0-rc.2
  '@deepseek-ai/dsh-session': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-title': 0.2.0-rc.2
  '@deepseek-ai/dsh-storage-domain': 0.2.0-rc.2
  '@deepseek-ai/dsh-workspace': 0.2.0-rc.2
  '@deepseek-ai/schemastery': 3.18.4
  '@types/node': ^22.20.0
  '@types/react': ~18.3.31
  '@types/react-dom': ~18.3.7
  '@vitest/coverage-v8': ^4.1.8
  immer: ^10.1.1
  jsdom: ^27.0.0
  lightningcss: ^1.33.0
  react: ^18.3.1
  react-dom: ^18.3.1
  tsdown: ^0.22.2
  typescript: ^6.0.3
  vitest: ^4.1.8
  zod: 4.4.3
  zustand: ~4.4.7

# 0.2.0-rc.2 未发布到可依赖的 registry。overrides 用 link: 指向本地 harness 构建产物，
# catalog 与 peerDependencies 仍声明字面版本 0.2.0-rc.2（兼容性检查读声明范围，不读解析位置）。
overrides:
  '@deepseek-ai/cordis': link:../deepseek-harness/vendor/cordis
  '@deepseek-ai/cosmokit': link:../deepseek-harness/vendor/cosmokit
